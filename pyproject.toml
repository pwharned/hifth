[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hifth-flashcards"
version = "0.1.0"
description = "Local-first media alignment and flashcard generation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
anki = ["genanki>=0.13,<0.14"] # Quran APKG generator only
asr = ["faster-whisper>=1.2,<2"]
classical = ["scipy>=1.11,<2", "torch>=2.2", "transformers>=4.40,<6"]
microsoft = ["edge-tts>=7,<8"]

[project.scripts]
flashcards = "flashcards.cli:main"
flashcards-import-subtitles = "flashcards.subtitles:main"
flashcards-import-media = "flashcards.import_media:main"
flashcards-prepare-asr = "flashcards.faster_whisper_backend:main_prepare"
flashcards-batch-srt = "flashcards.batch_srt:main"
flashcards-batch-ass = "flashcards.batch_ass:main"
flashcards-import-text = "flashcards.text:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["flashcards*", "quran_alignment*", "scripts*"]
exclude = ["scripts.classical_cloze.manual_reviewer"]

[tool.setuptools.package-data]
flashcards = ["schema/*.json"]
