<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Media Cloze Workshop</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="masthead">
    <div>
      <p class="eyebrow">Local transcript workshop</p>
      <h1 id="projectTitle">Media Cloze Workshop</h1>
    </div>
    <div class="header-actions">
      <span id="cardCount" class="card-count">0 cards</span>
      <button id="exportButton" class="button primary">Export Anki deck</button>
    </div>
  </header>

  <main class="workspace">
    <section class="source-panel panel">
      <div id="mediaMount" class="media-mount"></div>
      <div class="cue-toolbar">
        <button id="previousCue" class="icon-button" aria-label="Previous cue">&#8592;</button>
        <div class="cue-position">
          <span id="cueNumber">Cue 0 / 0</span>
          <span id="cueTime">0:00.000</span>
        </div>
        <button id="nextCue" class="icon-button" aria-label="Next cue">&#8594;</button>
      </div>
      <div class="search-row">
        <input id="cueSearch" type="search" placeholder="Find text in transcript">
        <button id="searchButton" class="button quiet">Find next</button>
      </div>
      <button id="playCue" class="button play">Play this cue</button>
    </section>

    <section class="editor-panel panel">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Select a learning unit</p>
          <h2>Transcript</h2>
        </div>
        <span class="instruction">Drag across tokens or use the boundary controls</span>
      </div>

      <div id="transcript" class="transcript" aria-label="Selectable transcript"></div>
      <div class="selection-controls">
        <button id="extendLeft" class="button quiet">Include left</button>
        <button id="shrinkLeft" class="button quiet">Remove left</button>
        <button id="shrinkRight" class="button quiet">Remove right</button>
        <button id="extendRight" class="button quiet">Include right</button>
        <button id="clearSelection" class="button quiet danger-text">Clear</button>
      </div>

      <div class="cloze-preview">
        <span class="preview-label">Card front</span>
        <div id="clozePreview">Select one or more tokens.</div>
      </div>

      <form id="cardForm" class="card-form">
        <label>
          Contextual meaning
          <input id="targetGloss" autocomplete="off" placeholder="student">
        </label>
        <label>
          Sentence translation
          <textarea id="sentenceTranslation" rows="2" placeholder="I am a student."></textarea>
        </label>
        <div class="form-row">
          <label>
            Unit type
            <select id="unitKind">
              <option value="unknown">Unclassified</option>
              <option value="word">Word</option>
              <option value="compound">Compound</option>
              <option value="fixed_expression">Fixed expression</option>
              <option value="collocation">Collocation</option>
              <option value="named_entity">Named entity</option>
              <option value="free_phrase">Free phrase</option>
            </select>
          </label>
          <label>
            Tags
            <input id="tags" autocomplete="off" placeholder="vietnamese, movie">
          </label>
        </div>
        <label>
          Phrase note
          <textarea id="analysis" rows="2" placeholder="Why this is learned together, component meanings, or usage notes"></textarea>
        </label>
        <button class="button primary create" type="submit">Create or update card</button>
      </form>

      <div class="saved-section">
        <div class="section-heading compact">
          <h2>Cards from this cue</h2>
        </div>
        <div id="cueCards" class="cue-cards"></div>
      </div>
    </section>
  </main>

  <div id="status" class="status" role="status" aria-live="polite"></div>
  <script src="/app.js"></script>
</body>
</html>
