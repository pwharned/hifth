<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quran Alignment Inspector</title>
    <style>
        /* ── Reset & Base ───────────────────────────────────────────────── */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        :root {
            --bg-primary:     #0f1117;
            --bg-secondary:   #1a1d27;
            --bg-card:        #21242f;
            --border:         #2e3140;
            --text-primary:   #e8eaf0;
            --text-secondary: #8b90a0;
            --text-arabic:    #f0f2f8;
            --accent:         #4f8ef7;
            --highlight-bg:   #4f8ef720;
            --highlight-word: #4f8ef7;
            --passed:         #3ecf8e;
            --warning:        #f5a623;
            --ayah-marker:    #6b7280;
        }
        body {
            background:  var(--bg-primary);
            color:       var(--text-primary);
            font-family: 'Segoe UI', system-ui, sans-serif;
            font-size:   15px;
            min-height:  100vh;
            padding:     24px;
        }
        /* ── Layout ─────────────────────────────────────────────────────── */
        .app {
            max-width: 900px;
            margin:    0 auto;
            display:   flex;
            flex-direction: column;
            gap: 20px;
        }
        /* ── Header ─────────────────────────────────────────────────────── */
        .header {
            display:         flex;
            align-items:     center;
            justify-content: space-between;
            padding-bottom:  16px;
            border-bottom:   1px solid var(--border);
            direction:       ltr;
        }
        .header h1 {
            font-size:   18px;
            font-weight: 600;
            color:       var(--text-primary);
            letter-spacing: 0.01em;
        }
        .header p {
            font-size: 13px;
            color:     var(--text-secondary);
            margin-top: 3px;
        }
        .status-badge {
            font-size:     12px;
            font-weight:   600;
            padding:       5px 12px;
            border-radius: 20px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        .status-badge.idle    { background: var(--bg-card);  color: var(--text-secondary); }
        .status-badge.ready   { background: #3ecf8e18;       color: var(--passed);         }
        .status-badge.playing { background: #4f8ef718;       color: var(--accent);         }
        /* ── Cards ──────────────────────────────────────────────────────── */
        .card {
            background:    var(--bg-card);
            border:        1px solid var(--border);
            border-radius: 10px;
            padding:       20px;
        }
        .card-title {
            font-size:     12px;
            font-weight:   600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color:         var(--text-secondary);
            margin-bottom: 14px;
            direction:     ltr;
        }
        /* ── File Inputs ────────────────────────────────────────────────── */
        .file-row {
            display:   flex;
            gap:       14px;
            direction: ltr;
        }
        .file-input-wrapper {
            flex:       1;
            display:    flex;
            flex-direction: column;
            gap:        6px;
        }
        .file-input-wrapper label {
            font-size: 12px;
            color:     var(--text-secondary);
        }
        .file-btn {
            width:         100%;
            padding:       10px 14px;
            background:    var(--bg-secondary);
            border:        1px solid var(--border);
            border-radius: 7px;
            color:         var(--text-primary);
            font-size:     13px;
            cursor:        pointer;
            text-align:    left;
            transition:    border-color 0.15s, background 0.15s;
            white-space:   nowrap;
            overflow:      hidden;
            text-overflow: ellipsis;
        }
        .file-btn:hover {
            border-color: var(--accent);
            background:   #4f8ef708;
        }
        .file-btn.loaded {
            border-color: var(--passed);
            color:        var(--passed);
        }
        input[type="file"] { display: none; }
        /* ── Audio Controls ─────────────────────────────────────────────── */
        .controls {
            display:     flex;
            align-items: center;
            gap:         14px;
            direction:   ltr;
        }
        .play-btn {
            width:         42px;
            height:        42px;
            border-radius: 50%;
            background:    var(--accent);
            border:        none;
            cursor:        pointer;
            display:       flex;
            align-items:   center;
            justify-content: center;
            flex-shrink:   0;
            transition:    opacity 0.15s;
        }
        .play-btn:disabled {
            opacity: 0.3;
            cursor:  not-allowed;
        }
        .play-btn:not(:disabled):hover { opacity: 0.85; }
        .play-btn svg { fill: white; }
        .progress-wrap {
            flex:     1;
            display:  flex;
            flex-direction: column;
            gap:      6px;
        }
        .progress-bar-track {
            width:         100%;
            height:        5px;
            background:    var(--bg-secondary);
            border-radius: 3px;
            cursor:        pointer;
            position:      relative;
        }
        .progress-bar-fill {
            height:        100%;
            background:    var(--accent);
            border-radius: 3px;
            width:         0%;
            transition:    width 0.05s linear;
            pointer-events: none;
        }
        .time-row {
            display:         flex;
            justify-content: space-between;
            font-size:       12px;
            color:           var(--text-secondary);
            font-variant-numeric: tabular-nums;
        }
        /* ── Stats Bar ──────────────────────────────────────────────────── */
        .stats-row {
            display:   flex;
            gap:       20px;
            direction: ltr;
        }
        .stat {
            display:       flex;
            flex-direction: column;
            gap:           2px;
        }
        .stat-label {
            font-size: 11px;
            color:     var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }
        .stat-value {
            font-size:   14px;
            font-weight: 600;
            color:       var(--text-primary);
            font-variant-numeric: tabular-nums;
        }
        .stat-value.highlight { color: var(--accent); }
        /* ── Verse Display ──────────────────────────────────────────────── */
        .verse-display {
            min-height:  160px;
            line-height: 2.4;
            direction:   rtl;
            text-align:  justify;
        }
        .ayah-block {
            display: inline;
        }
        .word-token {
            display:       inline-block;
            padding:       3px 5px;
            border-radius: 5px;
            font-size:     26px;
            font-family:   'Traditional Arabic', 'Scheherazade New', 'Amiri', serif;
            color:         var(--text-arabic);
            cursor:        default;
            transition:    background 0.08s, color 0.08s;
        }
        .word-token:hover {
            background: var(--highlight-bg);
        }
        .word-token.active {
            background: var(--highlight-bg);
            color:      var(--highlight-word);
            font-weight: bold;
        }
        .word-token.past {
            color: var(--text-secondary);
        }
        .ayah-number {
            display:       inline-flex;
            align-items:   center;
            justify-content: center;
            width:         28px;
            height:        28px;
            border-radius: 50%;
            border:        1px solid var(--ayah-marker);
            color:         var(--ayah-marker);
            font-size:     12px;
            font-family:   system-ui, sans-serif;
            margin:        0 4px;
            vertical-align: middle;
            flex-shrink:   0;
        }
        /* ── Tooltip ─────────────────────────────────────────────────────── */
        .word-token[data-tooltip] {
            position: relative;
        }
        .word-token[data-tooltip]:hover::after {
            content:       attr(data-tooltip);
            position:      absolute;
            bottom:        110%;
            left:          50%;
            transform:     translateX(-50%);
            background:    var(--bg-primary);
            border:        1px solid var(--border);
            color:         var(--text-secondary);
            font-size:     11px;
            font-family:   system-ui, sans-serif;
            padding:       4px 8px;
            border-radius: 5px;
            white-space:   nowrap;
            pointer-events: none;
            direction:     ltr;
            z-index:       10;
        }
        /* ── Empty State ─────────────────────────────────────────────────── */
        .empty-state {
            display:         flex;
            flex-direction:  column;
            align-items:     center;
            justify-content: center;
            min-height:      160px;
            gap:             8px;
            color:           var(--text-secondary);
            font-size:       14px;
        }
        .empty-state span {
            font-size: 28px;
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- Header -->
        <div class="header">
            <div>
                <h1>Quran Alignment Inspector</h1>
                <p>Spot-check word-level timestamps against audio</p>
            </div>
            <div id="statusBadge" class="status-badge idle">Idle</div>
        </div>
        <!-- File Loader -->
        <div class="card">
            <div class="card-title">Load Files</div>
            <div class="file-row">
                <div class="file-input-wrapper">
                    <label>WAV Audio</label>
                    <button class="file-btn" id="audioBtn" onclick="document.getElementById('audioInput').click()">
                        Choose .wav file
                    </button>
                    <input type="file" id="audioInput" accept=".wav,.mp3">
                </div>
                <div class="file-input-wrapper">
                    <label>Verified Alignment JSON</label>
                    <button class="file-btn" id="jsonBtn" onclick="document.getElementById('jsonInput').click()">
                        Choose .json file
                    </button>
                    <input type="file" id="jsonInput" accept=".json">
                </div>
            </div>
        </div>
        <!-- Audio Controls -->
        <div class="card">
            <div class="card-title">Playback</div>
            <div class="controls">
                <button class="play-btn" id="playBtn" disabled onclick="Inspector.togglePlay()">
                    <svg id="playIcon" width="16" height="16" viewBox="0 0 16 16">
                        <path d="M4 2l10 6-10 6V2z"/>
                    </svg>
                </button>
                <div class="progress-wrap">
                    <div class="progress-bar-track" id="progressTrack" onclick="Inspector.seek(event)">
                        <div class="progress-bar-fill" id="progressFill"></div>
                    </div>
                    <div class="time-row">
                        <span id="currentTime">0:00.0</span>
                        <span id="totalTime">0:00.0</span>
                    </div>
                </div>
            </div>
        </div>
        <!-- Stats -->
        <div class="card">
            <div class="card-title">Current State</div>
            <div class="stats-row">
                <div class="stat">
                    <span class="stat-label">Surah</span>
                    <span class="stat-value" id="statSurah">—</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Total Words</span>
                    <span class="stat-value" id="statWords">—</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Active Word</span>
                    <span class="stat-value highlight" id="statActive">—</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Active Ayah</span>
                    <span class="stat-value highlight" id="statAyah">—</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Score</span>
                    <span class="stat-value" id="statScore">—</span>
                </div>
            </div>
        </div>
        <!-- Verse Display -->
        <div class="card">
            <div class="card-title">Verse Display</div>
            <div class="verse-display" id="verseDisplay">
                <div class="empty-state">
                    <span>📂</span>
                    Load a WAV and JSON file to begin
                </div>
            </div>
        </div>
    </div>
    <audio id="audioEl"></audio>
    <script src="inspector.js"></script>
</body>
</html>
